name: night-ci

on:
  push:
    branches:
      - "night/**"
  pull_request:
  workflow_dispatch:

# Heavy suite; one run per ref at a time.
concurrency:
  group: night-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The committed lockfile is intentionally slightly out of sync; npm ci fails.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download AdaFace model (exceeds GitHub 100MB limit)
        run: |
          mkdir -p public/models
          curl -sL "https://huggingface.co/Evn9172/cvlface_adaface_ir101_webface12m_onnx/resolve/main/adaface_ir101.onnx" -o public/models/adaface_ir101_webface12m.onnx
          ls -la public/models/adaface_ir101_webface12m.onnx

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration + hard-case tests
        run: npm test

      - name: Held-out eval gate (leak-excluded, rank-1 floor)
        run: npm run test:heldout -- --floor 40

      - name: Full-catalog enroll/query parity
        run: npm run test:parity -- --floor 75

      - name: Legacy-geometry sampled benchmark (latency/tooling sanity)
        run: node scripts/evaluate-accuracy.mjs --tier 1 --limit 3 --concurrency 2

      - name: Install Playwright browser for interactive gates
        run: npx playwright install --with-deps chromium


      - name: Interactive gates (axe a11y smoke + throttled-CPU perf)
        run: |
          npx playwright install --with-deps chromium || true
          npm run dev -- --strictPort > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/a11y-smoke.mjs http://127.0.0.1:8080; A11Y=$?
          node scripts/perf-throttle.mjs http://127.0.0.1:8080 1,4; PERF=$?
          test "$A11Y" -eq 0 -a "$PERF" -eq 0

      - name: Production build
        run: npm run build
